name: CI

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ["17", "21"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"

      - name: Setup Mill
        uses: jodersky/setup-mill@v0.2.3

      - name: Cache Mill
        uses: actions/cache@v4
        with:
          path: |
            ~/.mill
            ~/.cache/coursier
          key: ${{ runner.os }}-mill-${{ hashFiles('build.sc') }}

      - name: Compile
        run: mill golem-java.compile

      - name: Run tests
        run: mill golem-java.test

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Mill
        uses: jodersky/setup-mill@v0.2.3

      - name: Install wasm-tools
        run: |
          curl -LO https://github.com/bytecodealliance/wasm-tools/releases/download/v1.0.54/wasm-tools-1.0.54-x86_64-linux.tar.gz
          tar xzf wasm-tools-1.0.54-x86_64-linux.tar.gz
          sudo mv wasm-tools-1.0.54-x86_64-linux/wasm-tools /usr/local/bin/

      - name: Compile
        run: mill golem-java.compile

  publish:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Mill
        uses: jodersky/setup-mill@v0.2.3

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Publish to Maven Central
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: |
          mill mill.scalalib.PublishModule/publishAll \
            golem-java.publishArtifacts \
            --sonatypeUri https://s01.oss.sonatype.org/service/local \
            --sonatypeSnapshotUri https://s01.oss.sonatype.org/content/repositories/snapshots \
            --publishVersion ${{ steps.get_version.outputs.VERSION }}
